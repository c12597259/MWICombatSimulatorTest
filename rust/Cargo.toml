[workspace]
members = ["combat-core", "combat-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "ISC"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
